connector.name=iceberg
# A catalog on the container's own disk, for the smoke only: TESTING_FILE_METASTORE keeps
# table metadata under hive.metastore.catalog.dir with no external service, and the
# native local filesystem stores the data files under /work. Production catalogs are REST
# (Lakekeeper) and are mounted by the deployment, never baked.
iceberg.catalog.type=TESTING_FILE_METASTORE
hive.metastore.catalog.dir=local:///warehouse
fs.native-local.enabled=true
local.location=/work
iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD
