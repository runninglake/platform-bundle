# Build, test, scan, sign and publish rl-duckdb.
#
# WHY THIS REPOSITORY. Engine images are the adopted layer of the RunningLake Runtime:
# upstream bytes, pinned and verified, never patched. ADR 12 in the private repository
# puts them here because they need no private source and a public repository has the
# Actions minutes and the GHCR storage that private tiers do not. The platform bundle
# itself, and our own binaries, are built in runninglake/runninglake; this workflow is a
# mirror of that repository's image-release.yaml with one image and one architecture.
#
# THE DIGEST IS THE POINT OF THE WHOLE JOB. A tag is mutable. The digest printed in the
# step summary is what runtimes/index.yaml in the private repository records against a
# train serial (ADR 9), and what the agent hands a sandbox pod. Nothing consumes the tag.
#
# linux/amd64 ONLY. The sandbox node pool is amd64 and the conformance corpus is measured
# on amd64; an arm64 image nobody measured would make the capability table false on it.
# EVERY ACTION IS PINNED BY COMMIT, NOT BY TAG. This workflow holds packages:write and
# id-token:write: it pushes the image that executes customer SQL and mints its signature.
# A tag is a pointer its owner can move, so a mutable `uses:` is a way for somebody
# else's compromised release process to sign an image as us. The trailing comment on
# each line is the version that commit was, for whoever bumps it next.
name: image-release

on:
  push:
    tags: ['rl-duckdb/v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp and tag the image with (default dev-<sha>)
        required: false
        type: string

permissions:
  contents: read
  packages: write
  # Keyless cosign. No private key exists to leak, rotate or forget; the signature is
  # bound to this workflow's OIDC identity.
  id-token: write

env:
  IMAGE: ghcr.io/runninglake/rl-duckdb
  # The hard budget from the runtime plan, applied to the UNCOMPRESSED image: the root
  # filesystem a sandbox node has on disk before the first query can start. The
  # compressed (registry) size is reported beside it.
  SIZE_BUDGET_BYTES: "209715200"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }   # the revision label wants a real sha, not a shallow one

      # The runner's tests run here, in the open, before any image is built. The
      # Dockerfile runs them again inside the build so an image can never be produced
      # from a runner that fails them.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: images/rl-duckdb/runner/go.mod
      - name: Test the runner
        working-directory: images/rl-duckdb/runner
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::gofmt"; exit 1; }
          go vet ./...
          go test -count=1 -race ./...

      # PINS.md IS A PROMISE, AND THIS IS THE ONLY THING THAT KEEPS IT. The README tells
      # a reader that every hash in that table is what the build verifies. What the build
      # verifies are the ARG defaults in the Dockerfile, and nothing compared the two: a
      # bumped digest with an unedited table would ship an image whose published
      # provenance describes different bytes. Documentation nobody checks is documentation
      # that is eventually false.
      - name: PINS.md names every pin the Dockerfile enforces
        run: |
          set -euo pipefail
          missing=0
          while read -r value; do
            grep -qF "$value" images/rl-duckdb/PINS.md || {
              echo "::error::$value is enforced by the Dockerfile and absent from PINS.md"
              missing=1
            }
          done < <(grep -oE '^[[:space:]]*ARG [A-Z_]+=(sha256:)?[0-9a-f]{64}' images/rl-duckdb/Dockerfile \
                   | sed -E 's/^[[:space:]]*ARG [A-Z_]+=//')
          version=$(grep -oE '^[[:space:]]*ARG DUCKDB_VERSION=[0-9.]+' images/rl-duckdb/Dockerfile | head -1 | cut -d= -f2)
          grep -qF "$version" images/rl-duckdb/PINS.md || {
            echo "::error::PINS.md does not name DuckDB $version"
            missing=1
          }
          test "$missing" = 0
          echo "every enforced pin appears in PINS.md, DuckDB ${version}"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp
        id: stamp
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#rl-duckdb/}"
          elif [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          echo "version=${version}"          >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%FT%TZ)"    >> "$GITHUB_OUTPUT"
          echo "version ${version}"

      # SCAN BEFORE PUSH, NOT AFTER.
      #
      # This used to push first and gate second, and the comment under the scan defended
      # it by saying it scanned before SIGNING. That is true and it is the wrong
      # invariant. The scan's own argument -- do not assert we stand behind these bytes
      # before we have earned it -- applies to publication just as much as to the
      # signature. A registry is not a private staging area: what is pushed there is
      # resolvable by tag, by anyone, immediately.
      #
      # It has already happened in the private repository's copy of this workflow.
      # rl-agent failed its scan on two CRITICAL findings and the run left a complete,
      # pullable image in ghcr with no signature, no reported digest, and nothing saying
      # it had been rejected. That digest was nearly pinned into a release train.
      #
      # So the image is built into the runner's own docker daemon and every gate that can
      # reject it -- size, smoke, scan -- runs against the local image. The push happens
      # only after all three pass, and a rejected build leaves nothing behind.
      #
      # `load: true` costs nothing here because this image is linux/amd64 only (RLR ships
      # engines single-arch at v1), and the push below reuses the same gha cache, so it
      # assembles a manifest rather than compiling a second time. `provenance`/`sbom` are
      # off for the local build only: they are OCI-exporter attestations the docker
      # exporter cannot carry, and the real push re-enables both.
      - name: Build for the gates
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: images/rl-duckdb
          file: images/rl-duckdb/Dockerfile
          platforms: linux/amd64
          load: true
          tags: rl-duckdb-local:${{ steps.stamp.outputs.version }}
          build-args: |
            VERSION=${{ steps.stamp.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The budget is a correctness gate, not a nicety: the sandbox is a single-use pod,
      # so image size is paid on every cold node and on every query that lands there.
      #
      # The gate is on the UNCOMPRESSED size, which is a property of the built image and
      # needs no registry at all. The compressed size is reported and not gated, so the
      # one measurement that genuinely needs a manifest moved below the push.
      - name: Assert the size budget
        id: size
        run: |
          set -euo pipefail
          REF="rl-duckdb-local:${{ steps.stamp.outputs.version }}"
          # The uncompressed size is the flattened root filesystem, measured by exporting
          # it. `docker image inspect .Size` is not that: under the containerd image store
          # it adds the compressed blobs to the unpacked layers and reads a third larger.
          CONTAINER="$(docker create "$REF")"
          UNCOMPRESSED="$(docker export "$CONTAINER" | wc -c | tr -d ' ')"
          docker rm "$CONTAINER" >/dev/null
          echo "uncompressed=${UNCOMPRESSED}" >> "$GITHUB_OUTPUT"
          printf 'uncompressed %d bytes (%d MB), budget %d bytes\n' \
            "$UNCOMPRESSED" "$((UNCOMPRESSED / 1048576))" "$SIZE_BUDGET_BYTES"
          if [ "$UNCOMPRESSED" -ge "$SIZE_BUDGET_BYTES" ]; then
            echo "::error::rl-duckdb is ${UNCOMPRESSED} bytes uncompressed; the budget is ${SIZE_BUDGET_BYTES}."
            exit 1
          fi

      # The image is run the way the pod runs it (uid 65532, read-only root, all
      # capabilities dropped, /work the only writable path, no credential) against a
      # local query, a non-query statement, a syntax error, a timeout and an HTTPS
      # Parquet read, and the Parquet it wrote is read back and checked. Everything
      # except the runtime class. Details in images/rl-duckdb/smoke/run.sh.
      #
      # Against the local image, so an engine that cannot answer a query is never
      # published. docker run does not care whether a reference came from a registry.
      - name: Smoke-test the image
        id: smoke
        run: |
          set -euo pipefail
          images/rl-duckdb/smoke/run.sh "rl-duckdb-local:${{ steps.stamp.outputs.version }}" | tee /tmp/smoke.log
          # A GATE THAT CANNOT TELL "PASSED" FROM "DID NOTHING" IS NOT A GATE.
          #
          # This step used to sed SMOKE_METRICS out of the log and stop. If that line
          # were ever absent -- a renamed marker, an early return, a case loop that
          # silently covered nothing -- the variable came back empty, the step stayed
          # green, and the job summary printed an empty metrics line under a heading that
          # said the image had been smoke-tested. The guard below is the floor: the run
          # must say every case passed, and it must have run as many cases as run.sh
          # actually invokes.
          #
          # The expected count is derived from the script rather than written here, so
          # adding a case cannot silently leave this assertion behind.
          EXPECTED="$(grep -c '^run_case ' images/rl-duckdb/smoke/run.sh)"
          ACTUAL="$(grep -c '^ok ' /tmp/smoke.log || true)"
          grep -qx 'smoke: all cases passed' /tmp/smoke.log \
            || { echo "::error::the smoke run never reported that all cases passed"; exit 1; }
          if [ "$EXPECTED" -lt 1 ] || [ "$ACTUAL" -ne "$EXPECTED" ]; then
            echo "::error::smoke exercised ${ACTUAL} cases; run.sh invokes ${EXPECTED}."
            exit 1
          fi
          METRICS="$(sed -n 's/^SMOKE_METRICS=//p' /tmp/smoke.log)"
          [ -n "$METRICS" ] || { echo "::error::the smoke run printed no SMOKE_METRICS line"; exit 1; }
          printf '%s' "$METRICS" | jq -e . >/dev/null \
            || { echo "::error::SMOKE_METRICS is not valid JSON: ${METRICS}"; exit 1; }
          echo "smoke exercised ${ACTUAL}/${EXPECTED} cases"
          echo "metrics=${METRICS}" >> "$GITHUB_OUTPUT"

      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rl-duckdb-local:${{ steps.stamp.outputs.version }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          # Dated, justified ignores; see images/rl-duckdb/.trivyignore. A finding in a
          # component no query reaches is still a finding, so it is written down with an
          # expiry rather than lowering the gate for everyone. ignore-unfixed is not
          # laxity: a finding with no available fix cannot be actioned by rebuilding.
          trivyignores: images/rl-duckdb/.trivyignore

      # Every gate has passed. Only now do these bytes become visible to anyone.
      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: images/rl-duckdb
          file: images/rl-duckdb/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.stamp.outputs.version }}
          build-args: |
            VERSION=${{ steps.stamp.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A DIGEST COMES FROM A SUCCESSFUL BUILD'S OUTPUT OR IT DOES NOT EXIST.
      #
      # An empty or malformed digest must stop here rather than reach `cosign sign` and
      # fail in a way that leaves something published and unattested. It also means the
      # summary an operator copies a pin out of reads a value this job produced, never
      # one resolved from a registry tag.
      - name: Refuse a digest the build did not produce
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::the build reported no usable digest: '$DIGEST'"; exit 1; }
          echo "build reported $DIGEST"

      # Reporting only, and the one measurement that genuinely needs the registry: the
      # compressed layer sizes are what a cold node actually pulls.
      - name: Record the compressed size
        id: compressed
        run: |
          set -euo pipefail
          REF="${IMAGE}@${{ steps.build.outputs.digest }}"
          MANIFEST="$(docker buildx imagetools inspect "$REF" --raw \
            | jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest')"
          COMPRESSED="$(docker buildx imagetools inspect "${IMAGE}@${MANIFEST}" --raw | jq '[.layers[].size] | add')"
          echo "compressed=${COMPRESSED}" >> "$GITHUB_OUTPUT"
          printf 'compressed %d bytes (%d MB)\n' "$COMPRESSED" "$((COMPRESSED / 1048576))"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign
        run: |
          cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Report the digest
        run: |
          {
            echo "### rl-duckdb ${{ steps.stamp.outputs.version }}"
            echo '```'
            echo "${IMAGE}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo "linux/amd64 only. Uncompressed ${{ steps.size.outputs.uncompressed }} bytes, compressed ${{ steps.compressed.outputs.compressed }} bytes, budget ${SIZE_BUDGET_BYTES}."
            echo
            echo "Smoke query \`SELECT count(*) AS n, sum(i) AS s FROM range(10000000) t(i)\` printed:"
            echo '```'
            echo "RL_METRICS ${{ steps.smoke.outputs.metrics }}"
            echo '```'
            echo "Record the digest against the train serial in \`runtimes/index.yaml\` (private repository, ADR 9)."
          } >> "$GITHUB_STEP_SUMMARY"
